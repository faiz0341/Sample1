<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #2f8f4e, #5fb867);
      color: #f5f9f1;
      font-family: Arial, sans-serif;
    }

    .container {
      text-align: center;
      padding: 3rem 2rem;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-radius: 24px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.16);
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 4vw, 4rem);
      letter-spacing: 0.05em;
    }

    p {
      margin: 1rem 0 0;
      font-size: 1.15rem;
      opacity: 0.9;
    }

    .accent {
      color: #e0ffd8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome to the Green Site</h1>
    <p class="accent">A calm, fresh landing page with a natural green theme.</p>
  </div>
</body>
</html>
